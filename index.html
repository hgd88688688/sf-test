<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>顺丰快递单号查询</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:40px 16px;
 background:#f3f4f6;
 font-family:Arial,"Microsoft YaHei",sans-serif;
}
.card{
 max-width:500px;
 margin:auto;
 padding:30px;
 background:white;
 border-radius:20px;
 box-shadow:0 5px 25px #0001;
}
h1{
 text-align:center;
 font-size:27px;
 margin:20px 0 30px;
}
.desc{
 text-align:center;
 color:#888;
 margin-bottom:35px;
}
input{
 width:100%;
 padding:18px;
 margin-bottom:16px;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:18px;
}
button{
 width:100%;
 padding:18px;
 background:#3575f5;
 color:white;
 border:0;
 border-radius:10px;
 font-size:20px;
}
button:disabled{opacity:.6}
#result{margin-top:25px}
.item{
 padding:16px;
 background:#f5f7fb;
 border-radius:10px;
 margin-top:12px;
 line-height:2;
 overflow-wrap:anywhere;
}
.success{
 background:#e7f8eb;
 color:green;
 padding:15px;
 border-radius:8px;
}
.tip{
 text-align:center;
 color:#888;
 margin-top:25px;
}
.tracking-label{font-size:14px;color:#777}
.tracking-no{
 font-weight:bold;font-size:21px;line-height:1.6;
 overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;
}
.copy-tip,.open-tip{color:#888;font-size:13px;line-height:1.6;text-align:center}
.tracking-meta{margin-top:12px;line-height:1.9}
.copy-button{background:#1677ff;margin-top:12px;font-size:16px;padding:12px}
.open-button{
 display:block;background:#ff4d4f;color:#fff;
 text-decoration:none;text-align:center;border-radius:9px;
 margin-top:10px;padding:12px;font-size:16px;line-height:1.5;
}
.open-tip{margin-top:8px}
</style>
</head>

<body>
<div class="card">
<h1>顺丰快递单号查询</h1>
<p class="desc">请输入收件人姓名和手机后四位</p>

<form id="form">
<input id="name" placeholder="收件人姓名" required maxlength="30">
<input id="phone" placeholder="手机后四位"
inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required>
<button id="btn" type="submit">立即查询</button>
</form>

<div id="result"></div>
<p class="tip">查询结果仅供收件人核对</p>
</div>

<script>
const API="https://sf-query-test.erge8868.workers.dev/api/query";
// Restored from old app.py: SF International waybill lookup landing page.
const SF_TRACKING_URL="https://www.sf-international.com/us/sc/support/querySupport/waybill";

const form=document.getElementById("form");
const result=document.getElementById("result");
const btn=document.getElementById("btn");

function message(text,cls="tip"){
 result.replaceChildren();
 const div=document.createElement("div");
 div.className=cls;
 div.textContent=text;
 result.appendChild(div);
}

async function copyTracking(number,button){
 let copied=false;
 try{
  if(navigator.clipboard && window.isSecureContext){
   await navigator.clipboard.writeText(number);
   copied=true;
  }
 }catch(error){ /* Browser denied direct clipboard access. */ }
 if(!copied){
  const area=document.createElement("textarea");
  area.value=number;
  area.setAttribute("readonly","");
  area.style.position="fixed";
  area.style.left="-9999px";
  document.body.appendChild(area);
  area.focus();
  area.select();
  area.setSelectionRange(0,area.value.length);
  try{copied=document.execCommand("copy");}catch(error){copied=false;}
  area.remove();
 }
 if(copied){
  button.textContent="✅ 已复制";
  button.style.background="#52c41a";
  setTimeout(()=>{
   button.textContent="① 复制单号";
   button.style.background="";
  },3000);
 }else{
  window.prompt("浏览器不允许自动复制，请长按复制这个运单号：",number);
 }
}

form.addEventListener("submit",async(e)=>{
 e.preventDefault();

 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();

 if(!name||!/^[0-9]{4}$/.test(phone)){
  message("请输入正确的姓名和手机后四位");
  return;
 }

 btn.disabled=true;
 btn.textContent="查询中...";

 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),15000);

 try{
  const response=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name,phone}),
   signal:controller.signal
  });

  const data=await response.json();

  if(response.status===429){
   message("查询过于频繁，请稍后再试");
  }else if(!response.ok||!data.ok){
   message("查询服务暂时不可用，请稍后再试");
  }else if(!data.items||data.items.length===0){
   message("没有查询到对应快递单号");
  }else{
   message("查询成功，共找到 "+data.items.length+" 条订单","success");

   data.items.forEach(item=>{
    const div=document.createElement("div");
    div.className="item";
    const label=document.createElement("div");
    label.className="tracking-label";
    label.textContent="顺丰运单号";
    const number=document.createElement("div");
    number.className="tracking-no";
    number.textContent=String(item.tracking_number ?? "");
    const tip=document.createElement("div");
    tip.className="copy-tip";
    tip.textContent="长按上方单号也可以复制";
    const meta=document.createElement("div");
    meta.className="tracking-meta";
    const warehouse=document.createElement("div");
    warehouse.textContent="仓库："+String(item.warehouse_name ?? "");
    const orderTime=document.createElement("div");
    orderTime.textContent="录单时间："+String(item.order_time || "暂无记录");
    meta.append(warehouse,orderTime);
    const copy=document.createElement("button");
    copy.type="button";
    copy.className="copy-button";
    copy.textContent="① 复制单号";
    copy.addEventListener("click",()=>copyTracking(number.textContent,copy));
    const open=document.createElement("a");
    open.className="open-button";
    open.textContent="② 打开顺丰查询";
    open.href=SF_TRACKING_URL;
    open.target="_blank";
    open.rel="noopener noreferrer";
    const openTip=document.createElement("div");
    openTip.className="open-tip";
    openTip.textContent="打开后，在运单号输入框长按粘贴";
    div.append(label,number,tip,meta,copy,open,openTip);
    result.appendChild(div);
   });
  }
 }catch(error){
  message("连接查询服务失败，请检查网络");
 }finally{
  clearTimeout(timer);
  btn.disabled=false;
  btn.textContent="立即查询";
 }
});
</script>
</body>
</html>
